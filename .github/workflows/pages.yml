name: Publish CHEONRANG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source and interactions
        run: node --test tests/site.test.cjs
      - name: Assemble static website
        run: |
          mkdir _site
          cp index.html styles.css app.js data.js .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CHEONRANG_MAIN_TEASER.MP4 ]; then cp CHEONRANG_MAIN_TEASER.MP4 _site/; fi
          if [ -f golden_cage_VER.1.mp3 ]; then cp golden_cage_VER.1.mp3 _site/; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
